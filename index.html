<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>과자 가격 비교표</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header>
    <h1>🛒 과자 가격 비교표</h1>
    <p class="sub">규격이 같은 상품을 선택하고 판매처별 실질 단가를 비교합니다</p>
    <div class="bars">
      <div class="bar"><input id="newName" placeholder="과자 이름 입력"><button class="btn primary" onclick="addSnack()">＋ 과자 추가</button></div>
      <div class="bar"><input id="newStore" placeholder="동네 마트 이름 입력"><button class="btn soft" onclick="addStore()">＋ 마트 열 추가</button></div>
    </div>
  </header>
  <main class="wrap">
    <div class="toolbar">
      <select id="basis" onchange="setBasis(this.value)"><option value="total">결제금액 비교</option><option value="each">개당 가격 비교</option><option value="100g">100g당 가격 비교</option></select>
      <button class="btn soft" onclick="openStoreSettings()">📍 기준 점포</button>
      <button class="btn soft" onclick="syncCloud('push')">☁️ 저장</button>
      <button class="btn soft" onclick="syncCloud('pull')">☁️ 불러오기</button>
      <span class="cloud" id="cloudStatus">로컬 저장</span>
    </div>
    <div class="tip">검색 후보는 상품명·브랜드·중량·개수·바코드 일치도를 점수화합니다. 후보를 직접 선택해야 가격이 반영되며, 선택한 상품 URL과 상품 ID가 다음 조회를 위해 저장됩니다.</div>
    <div class="tablebox"><table class="sheet"><thead><tr id="headRow"></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="foot"><button class="btn soft" onclick="sortRows()">🔥 가성비순 정렬</button><button class="btn soft" onclick="resetAll()">↩️ 전체 초기화</button></div>
  </main>
  <div class="modal" id="modal"><section class="panel"><div id="modalBody"></div></section></div>
  <script src="config.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
