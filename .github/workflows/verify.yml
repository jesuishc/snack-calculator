name: verify

on:
  push:
    branches: [refactor-v3-step1]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run verify
      - name: Live retailer smoke test
        if: github.event_name == 'push'
        run: node scripts/live-retailer-smoke.mjs
